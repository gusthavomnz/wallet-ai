spring.application.name=core-api

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wallet}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:9000}
aws.s3.public-url=${AWS_S3_PUBLIC_URL:http://localhost:9000}
aws.bucket-name=${AWS_BUCKET_NAME:wallet}
aws.region=${AWS_REGION:us-east-1}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:test}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:test}
